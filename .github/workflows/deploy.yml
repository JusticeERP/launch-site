name: Deploy Static Launch Page

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages Environment
        uses: actions/configure-pages@v4
        
      - name: Upload Artifact (Root Directory)
        uses: actions/upload-pages-artifact@v3
        with:
          # Uploads the entire root directory where index.html is located
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4